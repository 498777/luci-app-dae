name: Update dae version

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync upstream kdae
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare upstream kdae HEAD
        id: cmp
        run: |
          head=$(git ls-remote https://github.com/olicesx/dae.git refs/heads/kdae | awk '{print $1}')
          short=$(printf '%.7s' "$head")
          cur=$(grep '^PKG_VERSION:=' dae/Makefile | head -n 1 | cut -d= -f2)
          want="0.${short}"
          echo "upstream = $head"
          echo "short    = $short"
          echo "recorded = $cur"
          echo "want     = $want"
          if [ -z "$head" ]; then
            echo "failed to fetch upstream HEAD"
            exit 1
          fi
          if [ "$want" != "$cur" ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${want}/" dae/Makefile
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" dae/Makefile
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.cmp.outputs.changed == 'true'
        run: |
          ver=$(grep '^PKG_VERSION:=' dae/Makefile | head -n 1 | cut -d= -f2)
          echo "Syncing to ${ver}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dae/Makefile
          git commit -m "dae: sync upstream kdae @ ${ver}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          sleep 5
          gh workflow run "Build apk" --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
