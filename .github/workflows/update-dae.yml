name: Update dae version

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync upstream dae (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Compare upstream dae release
        id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release view --repo daeuniverse/dae --json tagName --jq '.tagName // ""' 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "failed to resolve upstream release tag"
            exit 1
          fi
          ver="${tag#v}"
          cur="$(grep '^DAE_RELEASE:=' dae/Makefile | head -n 1 | cut -d= -f2)"
          echo "upstream release = $tag  (version ${ver})"
          echo "recorded         = ${cur:-<none>}"
          case "$ver" in
            [0-9]*) ;;
            *) echo "::error::upstream version '${ver}' 不以数字开头，apk 不接受"; exit 1 ;;
          esac
          if [ "$tag" != "$cur" ]; then
            cur_ver="$(grep '^PKG_VERSION:=' dae/Makefile | head -n 1 | cut -d= -f2)"
            cur_rel="$(grep '^PKG_RELEASE:=' dae/Makefile | head -n 1 | cut -d= -f2)"
            if [ "$ver" = "$cur_ver" ]; then
              next_rel=$((cur_rel + 1))
            else
              next_rel=1
            fi
            sed -i "s/^DAE_RELEASE:=.*/DAE_RELEASE:=${tag}/" dae/Makefile
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${ver}/" dae/Makefile
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${next_rel}/" dae/Makefile
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 这一步不能删：用默认 GITHUB_TOKEN 完成的 push 不会触发其它 workflow
      # （GitHub 递归保护：由 GITHUB_TOKEN 触发的事件不会创建新的 workflow run，
      #  workflow_dispatch / repository_dispatch 除外），所以必须显式 dispatch。
      # 注意：build-apk.yml 的 prepare 门控是 `github.actor != 'github-actions[bot]'`，
      # 它只覆盖 GITHUB_TOKEN 推送（actor=bot）的情形；将来若改用 PAT 推送，actor 会变成
      # PAT 持有者而不是 bot，那时 push 与这里的 dispatch 会各起一次 run —— 由
      # build-apk.yml 的 concurrency（同一 ref、cancel-in-progress）兜住重复。
      - name: Commit and push
        if: steps.cmp.outputs.changed == 'true'
        run: |
          ver=$(grep '^PKG_VERSION:=' dae/Makefile | head -n 1 | cut -d= -f2)
          tag=$(grep '^DAE_RELEASE:=' dae/Makefile | head -n 1 | cut -d= -f2)
          echo "Syncing to ${tag} (${ver})"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dae/Makefile
          git commit -m "dae: sync upstream release ${tag} (${ver})"
          git push origin "HEAD:${BRANCH}"
          sleep 5
          gh workflow run "Build apk" --repo "$GITHUB_REPOSITORY" --ref "${BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
