name: Update dae version

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync upstream dae (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare upstream dae HEAD
        id: cmp
        run: |
          head=$(git ls-remote https://github.com/daeuniverse/dae.git refs/heads/main | awk '{print $1}')
          short=$(printf '%.7s' "$head")
          cur=$(grep '^DAE_COMMIT:=' dae/Makefile | head -n 1 | cut -d= -f2)
          echo "upstream = $head"
          echo "short    = $short"
          echo "recorded = $cur"
          if [ -z "$head" ]; then
            echo "failed to fetch upstream HEAD"
            exit 1
          fi
          if [ "$short" != "$cur" ]; then
            today=$(date +%Y.%m.%d)
            cur_ver=$(grep '^PKG_VERSION:=' dae/Makefile | head -n 1 | cut -d= -f2)
            cur_rel=$(grep '^PKG_RELEASE:=' dae/Makefile | head -n 1 | cut -d= -f2)
            if [ "$today" = "$cur_ver" ]; then
              next_rel=$((cur_rel + 1))
            else
              next_rel=1
            fi
            sed -i "s/^DAE_COMMIT:=.*/DAE_COMMIT:=${short}/" dae/Makefile
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${today}/" dae/Makefile
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${next_rel}/" dae/Makefile
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.cmp.outputs.changed == 'true'
        run: |
          ver=$(grep '^PKG_VERSION:=' dae/Makefile | head -n 1 | cut -d= -f2)
          sha=$(grep '^DAE_COMMIT:=' dae/Makefile | head -n 1 | cut -d= -f2)
          echo "Syncing to ${sha} (${ver})"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dae/Makefile
          git commit -m "dae: sync upstream dae @ ${sha} (${ver})"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          sleep 5
          gh workflow run "Build apk" --repo "$GITHUB_REPOSITORY" --ref "${BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
